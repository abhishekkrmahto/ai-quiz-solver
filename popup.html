<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 240px;
      font-family: sans-serif;
      padding: 14px;
      margin: 0;
    }
    button {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
    }
    button:hover {
      background: #1d4ed8;
    }
    p {
      font-size: 12px;
      color: #555;
      margin: 10px 0 0;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <button id="start">▶ Start Auto Solve</button>
  <p>
    Quiz wale tab pe click karo. ChatGPT background mein khulega aur
    answers khud tick + NEXT hote jayenge.
  </p>
  <script src="popup.js"></script>
</body>
</html>
